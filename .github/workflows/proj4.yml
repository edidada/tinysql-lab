name: Project 4 - planner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proj4:
    name: test-proj4 (planner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Show Go version
        run: go version
      - name: Run predicate push down test (proj4-1)
        run: make test-proj4-1
      - name: Run skyline pruning test (proj4-2)
        run: make test-proj4-2
