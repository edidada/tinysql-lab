name: Project 2 - parser

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proj2:
    name: test-proj2 (parser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Show Go version
        run: go version
      - name: Run test-proj2
        run: make test-proj2
