name: edidada-ci (tinysql)

# 只监听 edidada/course 分支的专用流水线：按 project 逐个跑 lab 测试
on:
  push:
    branches:
      - 'edidada/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"
      GOPROXY: "https://proxy.golang.org,direct"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build tidb-server
        run: go build ./...

      - name: "Project 1 (tablecodec)"
        run: cd tablecodec && go test -v

      - name: "Project 2 (parser DML statements)"
        run: cd parser && go test -v -check.f TestDMLStmt

      - name: "Project 3 (DDL add/drop/change column)"
        run: cd ddl && go test -v -timeout 200s -check.f "TestAddColumn|TestDropColumn|TestColumnChange"

      - name: "Project 4-1 (predicate push down)"
        run: cd planner/core && go test -v -check.f TestPredicatePushDown

      - name: "Project 4-2 (skyline pruning)"
        run: cd planner/core && go test -v -check.f TestSkylinePruning

      - name: "Project 5-1 (select executor and expression)"
        run: |
          go test -v ./executor -check.f "TestSelectExec"
          cd expression && go test -v -timeout 60s

      - name: "Prepare failpoint tool directory"
        run: mkdir -p tools/bin

      - name: "Install failpoint tools"
        run: make tools/bin/failpoint-ctl

      - name: "Project 5-2 (join executor)"
        run: |
          make failpoint-enable
          go test -v -timeout 600s ./executor -check.f "testSuiteJoin1|testSuiteJoin2|testSuiteJoin3"
          make failpoint-disable

      - name: "Project 5-3 (aggregation executor)"
        run: |
          make failpoint-enable
          go test -v -timeout 600s ./executor -check.f "testSuiteAgg"
          make failpoint-disable

      - name: "Project 6 (tikv store)"
        run: |
          make failpoint-enable
          go test -v -timeout 600s ./store/tikv -mockStore=false
          make failpoint-disable
