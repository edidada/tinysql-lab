name: Project 5 - executor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proj5:
    name: test-proj5 (executor)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Show Go version
        run: go version
      - name: Prepare failpoint tool directory
        run: mkdir -p tools/bin
      - name: Run selection and vectorized expression tests (proj5-1)
        run: make test-proj5-1
      - name: Run hash join tests (proj5-2)
        run: make test-proj5-2
      - name: Run aggregation tests (proj5-3)
        run: make test-proj5-3
