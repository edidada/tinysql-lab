name: Project 6 - transaction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proj6:
    name: proj6 (TiKV transaction)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Show Go version
        run: go version
      - name: Prepare failpoint tool directory
        run: mkdir -p tools/bin
      - name: Run TiKV transaction tests
        run: make proj6
