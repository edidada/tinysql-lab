name: Project 1 - tablecodec

on:
  push:
    branches:
      - 'edidada/**'
  pull_request:
    branches:
      - 'edidada/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proj1:
    name: test-proj1 (tablecodec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Show Go version
        run: go version
      - name: Run test-proj1
        run: make test-proj1
